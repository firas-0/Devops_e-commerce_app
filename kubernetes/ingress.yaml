apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: e-commerce-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: e-commerce.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: e-commerce-backend
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: e-commerce-frontend
            port:
              number: 80

