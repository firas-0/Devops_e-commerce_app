apiVersion: v1
kind: Service
metadata:
  name: e-commerce-backend
spec:
  selector:
    app: e-commerce-backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: e-commerce-frontend
spec:
  selector:
    app: e-commerce-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP

